name: smart_document_scanner
description: "APP scan PDF – scan tài liệu chuyên nghiệp, lưu trên thiết bị, chạy offline. App làm bởi Đào Duy Thanh, © since 2026."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

# Phiên bản dưới đây là ràng buộc đề xuất, CHƯA kiểm chứng build thực tế
# (xem docs/DEPENDENCIES.md). CI sẽ chạy `flutter pub get` và build để xác nhận.
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.4.0
  image: ^4.2.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.0
  google_mlkit_text_recognition: ^0.14.0
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
